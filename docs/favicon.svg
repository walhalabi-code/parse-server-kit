<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="parse-server-kit">
  <title>parse-server-kit</title>
  <!--
    A favicon is rendered at 16px more often than not, so this drops the muted
    under-layer: two overlapping spirals at that size are mud. What survives is
    the blue spiral and its dot, reversed out of a solid tile — the shape is
    still recognisably the full mark, just simplified for the size.

    Browser tab strips are the one place the page's own theme does not reach,
    so the colours come from prefers-color-scheme directly.
  -->
  <style>
    .tile { fill: #2563EB; }
    .mark { stroke: #FFFFFF; fill: none; }
    .dot  { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      /* A saturated tile glares against a dark tab strip; invert instead. */
      .tile { fill: #0F1216; }
      .mark { stroke: #5B9DFF; }
      .dot  { fill: #5B9DFF; }
    }
  </style>

  <rect class="tile" width="32" height="32" rx="7"/>

  <!--
    The blue layer's path, scaled 0.44 and centred. Stroke width is set on the
    unscaled path and then divided through, so it stays 2.6px at render size
    rather than shrinking with the geometry.
  -->
  <g transform="translate(4.1, 4.6) scale(0.44)" stroke-linecap="round" stroke-linejoin="round">
    <path class="mark"
          d="M 40 20 C 40 10, 28 8, 20 18 C 12 28, 12 40, 22 48 C 32 56, 46 48, 46 32 C 46 16, 34 6, 20 6 C 7 6, 2 18, 2 34 C 2 50, 12 60, 28 60 C 38 60, 48 53, 52 44"
          stroke-width="5.9"/>
    <circle class="dot" cx="25" cy="28" r="6"/>
  </g>
</svg>
