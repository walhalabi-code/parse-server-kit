version: 2

updates:
  # The library's own dependencies. Everything here is a devDependency or an
  # optional peer — this package ships with none of its own — so an update can
  # only break the build or the tests, never a consumer's install.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine churn, so the interesting ones stand out.
      dev-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # parse-server majors move the Node floor and the adapter internals this
      # library reaches into (MongoStorageAdapter, _adaptiveCollection). Those
      # are deliberate, tested upgrades, not something to merge on a Tuesday.
      - dependency-name: parse-server
        update-types: [version-update:semver-major]
      - dependency-name: parse
        update-types: [version-update:semver-major]

      # TypeScript majors, because this library is built entirely on LEGACY
      # decorators. TS 5 already defaults to the standard (TC39) ones and only
      # `experimentalDecorators` keeps the legacy behaviour; TS 7 is the native
      # rewrite. A major here can change the one language feature every
      # @ParseClass, @ParseField and @CloudFunction depends on, and the failure
      # mode is decorators quietly doing the wrong thing rather than a build
      # error. Upgrade deliberately, with the suite watched.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

      # @types/node must track the Node FLOOR, not the newest release. The
      # package declares engines >=20.19; typings from a much later major
      # describe APIs that do not exist there, so the compiler would accept
      # code that fails at runtime on a supported version — with nothing said
      # at build time.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Actions are executable code running with access to this repo and, in the
  # release workflow, to publishing rights. Keeping them current is the other
  # half of pinning them.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
